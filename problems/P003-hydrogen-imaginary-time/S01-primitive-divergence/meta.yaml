gates_failed: [no_unflagged_recall, code_audited, latex_clean]

# Why each non-obvious verdict, so the column can be read later without
# re-deriving the judgement. The user closed the loop with the failures on record;
# none was fixed, since step 3 of the log skill forbids editing the final document.
gates_detail:
  no_unflagged_recall: >-
    Fail. Two [R] tags in answer-2 are absent from its Risk register: the proton
    radius (about 1.6e-5 a_0) in §4.1 item 6, and "R_nl(0) = 0 for l >= 1, and
    likewise for continuum partial waves" in the coverage note of check C4.
    Neither is load-bearing. Every load-bearing [R], [A], [S] and {ver: no} item
    is in the register.
  general_refs_resolved: >-
    Pass, with two items noted. The qualitative remark in C.6 cites "Simon 1982,
    Khas'minskii's lemma" by name, without a number; it is tagged [R] {ver: no}
    and is not used. The prior-knowledge declaration names "Kleinert's book on
    path integrals" without a locator, as declared recall; it is in
    sources/independence.md and not in final.md.
  code_audited: >-
    Fail. The audit's pass 6 reads in full "PARTIAL. (Code was audited by
    reading; execution not performed in this session. Pass 6b performed
    symbolically)". No check is reviewed for circularity, vacuity, laundered
    assumptions or wrong quantity. Check C6 did not exist when the audit was
    written and has never been read by an auditor.
  code_output_present: >-
    Pass. Every run is reported, including the failed C5 run 1. answer-2 carries
    the round-2 outputs, which are byte-identical to round 1's. The only edit to
    any output is the removal of the sandbox path from scipy's warning lines in C5
    run 1, which the answer states.
  audit_trail_complete: >-
    Pass. One round, one audit report. answer-2 is the fix pass for a NIT, not a
    further round, so no audit-report-2 is owed. Its new material (the F1.1 step,
    check C6, §10) is unaudited.
  stopping_rule: >-
    Pass. Round 1 returned no BLOCKER and no MAJOR (CONVENTIONS §6), and answer-2
    closed the NIT.
  ground_truth_timing: >-
    Pass, vacuously: there is no external ground truth.
  latex_clean: >-
    Fail. final.pdf (44 pages) compiles with zero undefined references, zero
    undefined citations, zero missing characters and no \emph. Two overfull boxes
    exceed 10pt: 39.1pt and 34.8pt, the display equations (A3) and (B10), which
    are wider than the text block. One further overfull box of 3.6pt is below the
    threshold. Five overfull rows in the provenance appendix (up to 72pt) were
    cleared first by widening the columns of that table, which /log authors.
    lmodern was installed in the build sandbox (apt) because the template loads it.

