result_one_line: >-
  Z_N = +infinity for every N >= 1 and Delta-tau > 0, from a bead at the nucleus
  (time slicing only) and from the chain at infinity (shared with the exact trace);
  the exact kernel is finite everywhere (K_1(0,0) = 0.91957); the imaginary-time
  Trotter formula needs V bounded below, and -1/r is not.

