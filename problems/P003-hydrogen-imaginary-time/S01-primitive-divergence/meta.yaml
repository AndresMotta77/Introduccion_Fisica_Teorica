problem_id: P003.S01
parent: P003                 # container: problems/P003-hydrogen-imaginary-time/ (see ../PLAN.md)
# Subproblem ids of the form P003.S01 are proposed in PLAN §7, item 1, and are not
# yet in CONVENTIONS §8 or in New-Problem.ps1. This folder was laid out by hand to
# match what New-Problem.ps1 seeds for a top-level problem. /log v1.6 has no
# container support either; it was applied to this folder as if it were a problem.
slug: primitive-divergence
title: "Failure of the primitive path integral at r = 0 for the Coulomb potential"
# prompt0 narrowed at the user's request on 2026-10-19: the subproblem only (the
# primitive trace, its divergence at r = 0, comparison with the continuum), with no
# project context and no trial-function projection, which moves to S05.
course: "Introduction to Theoretical Physics"
project: "Guide 15, Project 04: hydrogen by imaginary time"
phase: 1
chunks: [K1]                 # ../paper/kole-deraedt-2001/chunks.md
loop_weight: full            # PLAN §4.3: human attempt, optional blind solve, audit loop, perturbation test
paper_access: closed-book    # Kole and De Raedt and the course repository withheld (prompt0 §5)
opened: 2026-10-19
closed: 2026-10-19
status: closed               # open | closed | escalated | abandoned
verdict: ACCEPT              # ACCEPT | ACCEPT-WITH-FIXES | REVISE | REJECT | ESCALATED
# The verdict is the auditor's. It was given with one NIT (F1.1) open; CONVENTIONS
# §5 lets that case be read as ACCEPT or as ACCEPT-WITH-FIXES and does not say which
# takes precedence (audits/findings.yaml, S1.4). Recorded as given.
rounds: 1

templates:
  conventions: v1.5
  prompt0: v1.3
  audit: v1.4
  blind_solve: v1.0
  exploration: v1.0
  human_attempt: v1.1
  log_skill: v1.6
