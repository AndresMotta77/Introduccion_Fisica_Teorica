                               # probably the export time. human/attempt.md still says
                               # "2026-10-17, from the file name; to confirm" and is left
                               # unedited, as that file instructs.
  authors: team                # "our work"; names not recorded
  time_spent_min: unknown
  reached_an_answer: partial   # commits to the divergence (pp. 8-9); stops at the open-path matrix element (p. 9)
  prediction: >-
    The primitive weight is unbounded as r -> 0, its radial integral diverges,
    and the kinetic term does not compensate.
  prediction_correct: true     # against the final answer, not against external ground truth (there is none)
  model_found_error_i_missed: true
  # The final answer finds, in pp. 4-9: beta V where Delta-beta V is meant (p. 6,
  # H3); a one-dimensional prefactor and coordinates for a three-dimensional problem
  # (H3, and radial coordinates in the kinetic term on p. 8); ground-state dominance
  # applied to a trace that is infinite for hydrogen (H1); and the large-volume
  # divergence not mentioned (H6). See final/final.md Part D.
  i_found_error_model_missed: unknown
  consulted: unknown           # human/attempt.md leaves this to fill
  prior_exposure: >-
