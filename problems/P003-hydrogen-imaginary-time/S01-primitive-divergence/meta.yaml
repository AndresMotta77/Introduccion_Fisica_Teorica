run_against_templates:
  conventions: v1.5
  prompt0: v1.3
  audit: v1.4
  # What answer-1, audit-report-1 and answer-2 were produced under. The sent audit
  # prompt (prompts/audit-prompt-1.md) carries no version header; v1.4 is the
  # version in templates/ when it was sent.

# One entry per model call. Effort level cannot be observed from inside a
# session, so it is always user-reported, and `unknown` is a valid value.
# Never guess one: a guessed field silently poisons comparisons across runs.
runs:
  - artifact: answers/answer-1.md
    role: solver
    model_id: claude-opus-5-5
    model_label: "Claude Opus 5.5"
    model_source: self-reported      # the session's configured model id; the serving model cannot be observed
    effort: extra
    effort_source: user-reported     # from prompts/prompt0.md §0, written there as ⟨extra⟩
    tools: [code, web]
    context: project                 # Vibe Physics project; the solver read claude/start-here.md (declared in §1)
    date: 2026-10-19

  - artifact: audits/audit-report-1.md
    role: auditor
    model_id: unknown
    model_label: "Gemini"
    model_source: self-reported      # run header of the report; the version was not stated
    effort: high
    effort_source: self-reported     # run header of the report
    tools: []                        # run header: code execution no, web no
    code_executed: false
    date: 2026-10-19
    # Verdict ACCEPT, one finding (F1.1, NIT), accepted. Pass 6 was reported as
    # partial (code read, not run). Pass 7 reports the citations as verified,
    # although no web access was declared (findings.yaml S1.1). The [FOCUS] block
    # of the audit prompt was left empty.

  - artifact: answers/answer-2.md
    role: solver
    model_id: claude-opus-5-5
    model_label: "Claude Opus 5.5"
    model_source: self-reported
    effort: extra
    effort_source: user-reported     # prompt0 §0; not restated for round 2
    tools: [code, web]
    context: project                 # the same session as answer-1, not a fresh context
    date: 2026-10-19

