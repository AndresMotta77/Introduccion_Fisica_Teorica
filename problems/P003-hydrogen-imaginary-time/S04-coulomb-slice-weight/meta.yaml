# Scope, decided 2026-11-12 when the prompt0 was drafted. Two changes to the draft
# statements of K7 and K8 in chunks.md. (1) The two-particle reduction of K7 (the paper's
# eqs. (23)-(24), D = D1 + D2) was removed: it is needed only for helium (K13, an option).
# (2) Part (c), the hydrogen levels from the spectrum of the one-slice operator for l <= 2
# and n <= 3, was added. The user asked for the formula to be compared with the known
# hydrogen levels. It is a deterministic computation, not the phase-2 sampler. Two
# consequences: S04 is at the chunk-size limit of PLAN §4.1 (three checks), so if round 1
# shows it does not fit, (c) moves to a subproblem of its own that takes (b) through §3a.
# And the order in tau that (c) measures overlaps RQ3, which the PLAN leaves to the phase-3
# sweep; the sweep then tests a prediction instead of measuring blind.
# The decisive test and perturbation variant go to the auditor in the [FOCUS] block once
# answer-1 exists: paste the block "[FOCUS] for round 1" under this subproblem's chunk in
